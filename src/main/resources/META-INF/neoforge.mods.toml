license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="NoTuring_Steve"
description='''
Brings some funny things into Illusion Mod.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="${kff_version_range}"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dxr_mc"
    type="required"
    versionRange="${target_dxrmc_version_range}"
    ordering="BEFORE"
    side="BOTH"

